<!DOCTYPE html>
<html lang="{{ page.lang | default: 'zh-CN' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}{% if page.title_suffix %} - {{ page.title_suffix }}{% endif %}</title>
    <link rel="stylesheet" href="/assets/css/main.css">
    {% seo %}
    {% feed_meta %}
</head>
<body>
    <a href="#main-content" class="skip-link">跳转到内容</a>
    {% include nav.html %}
    <main id="main-content">
        {{ content }}
    </main>
    <footer>
        <p>&copy; {{ site.time | date: '%Y' }} {{ site.title | default: '陈栢成' }} | <a href="https://github.com/bayzhen">GitHub</a></p>
    </footer>
</body>
</html>
