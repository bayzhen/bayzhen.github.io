<body>
  <a class="skip-link" href="#star-game">跳转到婚礼邀请小游戏</a>

  <main class="game-shell" data-game-shell>
    <picture class="game-backdrop" aria-hidden="true">
      <source srcset="/wedding/assets/photos/starlight-couple-small.webp 640w, /wedding/assets/photos/starlight-couple.webp 1280w" sizes="100vw">

      <span>Wedding invitation</span>
      <span>October 06 · 2026</span>

    <section class="star-game" id="star-game" aria-labelledby="game-title" data-star-game>
      <div class="game-intro">
        <p>陈栢成 &amp; 任鹭</p>
        <h1 id="game-title">点亮三颗星，<br><em>开启我们的邀请</em></h1>
      </div>

      <div class="star-field" aria-label="散落在画面中的三颗星">
        <button class="game-star game-star--one" type="button" data-word="相遇" aria-label="点亮相遇之星" aria-pressed="false">
          <span aria-hidden="true">✦</span><small>相遇</small>
        </button>
        <button class="game-star game-star--two" type="button" data-word="相知" aria-label="点亮相知之星" aria-pressed="false">
          <span aria-hidden="true">✦</span><small>相知</small>
        </button>
        <button class="game-star game-star--three" type="button" data-word="相守" aria-label="点亮相守之星" aria-pressed="false">
          <span aria-hidden="true">✦</span><small>相守</small>
        </button>
      </div>

      <div class="game-progress" aria-live="polite">
        <span data-game-status>已点亮 0 / 3</span>
        <i data-progress-dot></i><i data-progress-dot></i><i data-progress-dot></i>
      </div>
      <p class="game-announcement" data-game-announcement aria-live="assertive"></p>
    </section>

    <section class="game-invitation" data-game-invitation aria-labelledby="invitation-title" hidden>
      <article class="game-card">
        <p class="game-card__kicker">Invitation unlocked</p>
        <h2 id="invitation-title" tabindex="-1">陈栢成 <i>&amp;</i> 任鹭</h2>
        <div class="game-card__date" aria-label="2026年10月6日10时58分举行典礼">
          <span>2026</span><strong>10 · 06</strong><span>10:58 典礼</span>
        </div>
        <p class="game-card__place">辽阳市 · 龙和缘酒店</p>
        <p class="game-card__message">诚挚邀请你，见证我们从此并肩，共赴岁岁年年。</p>
        <a class="calendar-link" href="/wedding/save-the-date.ics" download="陈栢成-任鹭-婚礼典礼.ics" aria-label="下载陈栢成与任鹭 2026 年 10 月 6 日 10 点 58 分婚礼典礼到日历"><span>保存典礼 · 添加到日历</span></a>

    </section>

      <span>辽阳 · 10:58</span>
