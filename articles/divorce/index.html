    const STORAGE_KEY = 'divorce_novel_progress';
    let currentChapter = 0;
    let readChapters = new Set();
    let chapterCache = {};

    // Load saved state
    function loadState() {
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const data = JSON.parse(saved);
                currentChapter = data.current || 0;
                readChapters = new Set(data.read || []);
            }
        } catch(e) {}
    }

    function saveState() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                current: currentChapter,
                read: [...readChapters]
            }));
        } catch(e) {}
    }

    function updateProgress() {
        const count = readChapters.size;
        document.getElementById('progressInfo').textContent = `阅读进度：${count} / ${TOTAL}`;
        document.getElementById('progressBar').style.width = (count / TOTAL * 100) + '%';
    }

    // Build TOC
    function buildToc() {
        const grid = document.getElementById('chapterGrid');
        grid.innerHTML = '';
        for (let i = 0; i < TOTAL; i++) {
            const div = document.createElement('div');
            div.className = 'chapter-item' + (readChapters.has(i+1) ? ' read' : '') + (currentChapter === i+1 ? ' current' : '');
            div.textContent = TITLES[i];
            div.title = TITLES[i];
            div.onclick = () => goChapter(i + 1);
            grid.appendChild(div);
        }
        // Build select
        const sel = document.getElementById('chapterSelect');
        sel.innerHTML = '';
        for (let i = 0; i < TOTAL; i++) {
            const opt = document.createElement('option');
            opt.value = i + 1;
            opt.textContent = TITLES[i];
            sel.appendChild(opt);
        }
    }

    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function showToc() {
        buildToc();
        showView('tocView');
        window.scrollTo(0, 0);
    }

    async function goChapter(num) {
        if (num < 1 || num > TOTAL) return;
        currentChapter = num;
        readChapters.add(num);
        saveState();

        showView('readerView');
        document.getElementById('readerTitle').textContent = TITLES[num - 1];
        document.getElementById('chapterSelect').value = num;
        document.getElementById('btnPrev').disabled = num <= 1;
        document.getElementById('btnNext').disabled = num >= TOTAL;

        const content = document.getElementById('readerContent');
        content.innerHTML = '<div class="reader-loading">加载中...</div>';
        window.scrollTo(0, 0);

        try {
            let text = chapterCache[num];
            if (!text) {
                const pad = String(num).padStart(4, '0');
                const resp = await fetch(`chapters/chapter_${pad}.txt`);
                text = await resp.text();
                chapterCache[num] = text;
            }
            // Parse: skip first line (title), convert lines to paragraphs
            const lines = text.split('\n');
            let html = '';
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line) html += `<p>${escapeHtml(line)}</p>`;
            }
            content.innerHTML = html || '<p>（本章无内容）</p>';
        } catch(e) {
            content.innerHTML = '<div class="reader-loading">加载失败，请刷新重试</div>';
        }

        updateProgress();
    }

    function escapeHtml(str) {
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function prevChapter() { if (currentChapter > 1) goChapter(currentChapter - 1); }
    function nextChapter() { if (currentChapter < TOTAL) goChapter(currentChapter + 1); }

    // Font size
    function setFont(size) {
        document.getElementById('readerWrap').className = 'reader-wrap font-' + size;
        document.querySelectorAll('.settings-bar button').forEach(b => {
            if (['小字','中字','大字'].includes(b.textContent)) b.classList.remove('active');
        });
        const labels = {'small':'小字','medium':'中字','large':'大字'};
        document.querySelectorAll('.settings-bar button').forEach(b => {
            if (b.textContent === labels[size]) b.classList.add('active');
        });
        try { localStorage.setItem('divorce_font', size); } catch(e) {}
    }

    // Dark mode
    function toggleDark() {
        document.body.classList.toggle('dark');
        const isDark = document.body.classList.contains('dark');
        document.getElementById('btnDark').classList.toggle('active', isDark);
        try { localStorage.setItem('divorce_dark', isDark ? '1' : '0'); } catch(e) {}
    }

    // Keyboard navigation
    document.addEventListener('keydown', e => {
        if (document.getElementById('readerView').classList.contains('active')) {
            if (e.key === 'ArrowLeft') prevChapter();
            else if (e.key === 'ArrowRight') nextChapter();
            else if (e.key === 'Escape') showToc();
        }
    });

    // Init
    loadState();
    updateProgress();
    buildToc();

    // Restore settings
    try {
        const font = localStorage.getItem('divorce_font');
        if (font) setFont(font);
        if (localStorage.getItem('divorce_dark') === '1') toggleDark();
    } catch(e) {}

    // If user was reading, resume
    if (currentChapter > 0) {
        goChapter(currentChapter);
    }
