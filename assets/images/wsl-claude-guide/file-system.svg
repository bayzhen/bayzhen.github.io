<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="800" height="480" rx="16" fill="#f8f9fa"/>
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">文件管理 = 整理你的衣柜</text>

  <!-- Left side: Real closet analogy -->
  <rect x="30" y="55" width="350" height="400" rx="14" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/>
  <text x="205" y="85" text-anchor="middle" font-size="15" font-weight="bold" fill="#e65100">🏠 现实中的衣柜</text>

  <!-- Closet shelves -->
  <rect x="60" y="100" width="290" height="60" rx="8" fill="#ffe0b2"/>
  <text x="80" y="125" font-size="24">👔</text>
  <text x="115" y="128" font-size="12" fill="#4e342e">上衣区</text>
  <text x="200" y="128" font-size="11" fill="#795548">→ 白衬衫、蓝T恤、红毛衣...</text>

  <rect x="60" y="170" width="290" height="60" rx="8" fill="#ffe0b2"/>
  <text x="80" y="195" font-size="24">👖</text>
  <text x="115" y="198" font-size="12" fill="#4e342e">裤子区</text>
  <text x="200" y="198" font-size="11" fill="#795548">→ 牛仔裤、西裤、运动裤...</text>

  <rect x="60" y="240" width="290" height="60" rx="8" fill="#ffe0b2"/>
  <text x="80" y="265" font-size="24">👟</text>
  <text x="115" y="268" font-size="12" fill="#4e342e">鞋子区</text>
  <text x="200" y="268" font-size="11" fill="#795548">→ 运动鞋、高跟鞋、拖鞋...</text>

  <text x="205" y="330" text-anchor="middle" font-size="12" fill="#666">衣柜 = 大格子里套小格子</text>
  <text x="205" y="350" text-anchor="middle" font-size="12" fill="#666">每个东西都在固定的位置</text>
  <text x="205" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">找衣服 → 先选区域 → 再选具体的</text>

  <!-- Equals sign -->
  <text x="400" y="250" text-anchor="middle" font-size="36" fill="#90a4ae">=</text>

  <!-- Right side: Computer files -->
  <rect x="420" y="55" width="350" height="400" rx="14" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="595" y="85" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e7d32">💻 电脑里的文件夹</text>

  <!-- File tree -->
  <rect x="450" y="100" width="290" height="60" rx="8" fill="#c8e6c9"/>
  <text x="470" y="125" font-size="24">📁</text>
  <text x="505" y="128" font-size="12" fill="#1b5e20">工作报告/</text>
  <text x="590" y="128" font-size="11" fill="#388e3c">→ 周报.docx、月报.xlsx...</text>

  <rect x="450" y="170" width="290" height="60" rx="8" fill="#c8e6c9"/>
  <text x="470" y="195" font-size="24">📁</text>
  <text x="505" y="198" font-size="12" fill="#1b5e20">项目资料/</text>
  <text x="590" y="198" font-size="11" fill="#388e3c">→ 方案.pptx、数据.csv...</text>

  <rect x="450" y="240" width="290" height="60" rx="8" fill="#c8e6c9"/>
  <text x="470" y="265" font-size="24">📁</text>
  <text x="505" y="268" font-size="12" fill="#1b5e20">学习笔记/</text>
  <text x="590" y="268" font-size="11" fill="#388e3c">→ AI学习.md、总结.txt...</text>

  <text x="595" y="330" text-anchor="middle" font-size="12" fill="#666">文件夹 = 大格子里套小格子</text>
  <text x="595" y="350" text-anchor="middle" font-size="12" fill="#666">每个文件都在固定的位置</text>
  <text x="595" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">找文件 → 先选文件夹 → 再选具体的</text>

  <!-- Bottom message -->
  <rect x="130" y="420" width="540" height="35" rx="8" fill="#e1f5fe"/>
  <text x="400" y="443" text-anchor="middle" font-size="13" fill="#0277bd">完全一样的逻辑！只是从实体变成了电子版 ✨</text>
</svg>
