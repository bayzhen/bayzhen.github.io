<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="800" height="520" rx="16" fill="#f8f9fa"/>
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">VS Code 界面地图</text>

  <!-- VS Code window frame -->
  <rect x="40" y="55" width="720" height="440" rx="8" fill="#1e1e1e" stroke="#333" stroke-width="2"/>

  <!-- Title bar -->
  <rect x="40" y="55" width="720" height="32" rx="8" fill="#323233"/>
  <rect x="40" y="75" width="720" height="12" fill="#323233"/>
  <!-- Traffic lights -->
  <circle cx="62" cy="71" r="6" fill="#ff5f57"/>
  <circle cx="82" cy="71" r="6" fill="#ffbd2e"/>
  <circle cx="102" cy="71" r="6" fill="#28c840"/>
  <text x="400" y="76" text-anchor="middle" font-size="11" fill="#aaa">Visual Studio Code</text>

  <!-- Sidebar (Explorer) -->
  <rect x="40" y="87" width="200" height="408" fill="#252526"/>
  <text x="140" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#bbb">资源管理器</text>

  <!-- File tree in sidebar -->
  <text x="60" y="135" font-size="11" fill="#e0e0e0">📁 我的项目</text>
  <text x="78" y="155" font-size="10" fill="#aaa">📁 工作报告</text>
  <text x="96" y="173" font-size="10" fill="#aaa">📄 周报.md</text>
  <text x="96" y="191" font-size="10" fill="#aaa">📄 月报.md</text>
  <text x="78" y="211" font-size="10" fill="#aaa">📁 数据分析</text>
  <text x="96" y="229" font-size="10" fill="#aaa">📄 分析.py</text>

  <!-- Main editor area -->
  <rect x="240" y="87" width="520" height="290" fill="#1e1e1e"/>
  <!-- Tab -->
  <rect x="240" y="87" width="100" height="28" fill="#1e1e1e" stroke="#333" stroke-width="1"/>
  <text x="290" y="105" text-anchor="middle" font-size="10" fill="#ddd">📄 周报.md</text>

  <!-- Editor content -->
  <text x="260" y="140" font-size="11" fill="#569cd6"># 本周工作总结</text>
  <text x="260" y="162" font-size="11" fill="#d4d4d4">这里是文件的内容</text>
  <text x="260" y="184" font-size="11" fill="#d4d4d4">你可以在这里编辑文字</text>
  <text x="260" y="206" font-size="11" fill="#6a9955">（就像记事本一样）</text>

  <!-- Terminal area -->
  <rect x="240" y="377" width="520" height="118" fill="#1e1e1e" stroke="#333" stroke-width="1"/>
  <text x="255" y="395" font-size="10" fill="#888">终端 TERMINAL</text>
  <rect x="240" y="400" width="520" height="95" fill="#0d1117"/>
  <text x="260" y="420" font-size="11" fill="#4ec9b0">user@ubuntu:~$</text>
  <text x="390" y="420" font-size="11" fill="#d4d4d4">claude</text>
  <text x="260" y="442" font-size="11" fill="#c586c0">🤖 Claude Code 已启动!</text>
  <text x="260" y="464" font-size="11" fill="#d4d4d4">你好！有什么我可以帮你的？</text>
  <text x="260" y="484" font-size="11" fill="#4ec9b0">❯</text>
  <text x="280" y="484" font-size="11" fill="#666">在这里输入你的需求...</text>

  <!-- WSL indicator -->
  <rect x="40" y="487" width="720" height="8" rx="0" fill="#007acc"/>
  <rect x="40" y="487" width="140" height="8" fill="#16825d"/>
  <text x="110" y="504" text-anchor="middle" font-size="9" fill="#16825d">🟢 WSL: Ubuntu ← 看到这个就对了！</text>

  <!-- Callout annotations -->
  <!-- Left sidebar callout -->
  <rect x="0" y="130" width="36" height="80" rx="6" fill="#fff3e0" stroke="#fb8c00" stroke-width="1"/>
  <text x="18" y="155" text-anchor="middle" font-size="9" fill="#e65100" transform="rotate(-90, 18, 165)">文件列表</text>

  <!-- Editor callout -->
  <line x1="500" y1="55" x2="500" y2="47" stroke="#3498db" stroke-width="1.5"/>
  <rect x="430" y="25" width="140" height="22" rx="6" fill="#e3f2fd" stroke="#3498db" stroke-width="1"/>
  <text x="500" y="40" text-anchor="middle" font-size="10" fill="#1565c0">编辑区 = 写字板</text>

  <!-- Terminal callout -->
  <line x1="710" y1="440" x2="770" y2="440" stroke="#8e24aa" stroke-width="1.5"/>
  <text x="770" y="435" font-size="10" fill="#8e24aa">↑</text>
  <text x="770" y="450" font-size="9" fill="#8e24aa">Claude Code</text>
  <text x="770" y="462" font-size="9" fill="#8e24aa">在这里！</text>
</svg>
